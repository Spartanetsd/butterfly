<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2e2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Крылья">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Крылья на рассвете</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='20' cy='24' rx='15' ry='13' fill='%23f493b6'/%3E%3Cellipse cx='44' cy='24' rx='15' ry='13' fill='%23f493b6'/%3E%3Cellipse cx='23' cy='44' rx='11' ry='10' fill='%23f7b6cc'/%3E%3Cellipse cx='41' cy='44' rx='11' ry='10' fill='%23f7b6cc'/%3E%3Cellipse cx='32' cy='36' rx='4' ry='17' fill='%236d4b62'/%3E%3C/svg%3E">
<style>
  :root{
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f2e2ea}
  body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:var(--sans);color:#5b3f55}
  #scene{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

  .pill{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 10px);display:flex;align-items:center;gap:7px;height:44px;border-radius:22px;
    background:rgba(255,249,240,.74);box-shadow:0 4px 14px rgba(120,80,100,.14), inset 0 0 0 1px rgba(255,255,255,.65);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #counter{left:calc(env(safe-area-inset-left, 0px) + 12px);padding:0 15px 0 9px;font:700 19px/1 var(--sans);color:#5b3f55;
    opacity:0;transform:translateY(-6px);transition:opacity .5s ease, transform .5s ease, box-shadow .6s ease;pointer-events:none}
  #counter.show{opacity:1;transform:none}
  #counter.done{box-shadow:0 0 0 2px rgba(243,193,78,.75), 0 6px 22px rgba(240,180,60,.45)}
  #counter svg{width:26px;height:26px;flex:none}
  #cnt{display:inline-block;min-width:1.2em;text-align:right;font-variant-numeric:tabular-nums}
  #counter .num{display:inline-flex;align-items:baseline}
  #counter .of{opacity:.55;font-weight:600}
  #cnt.pop{animation:pop .38s ease-out}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}

  #sound{right:calc(env(safe-area-inset-right, 0px) + 12px);width:46px;height:46px;padding:0;justify-content:center;border:none;margin:0;
    color:#5b3f55;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
  #sound svg{width:24px;height:24px}
  #sound .on{display:none}
  #sound[aria-pressed="true"] .on{display:inline}
  #sound[aria-pressed="true"] .off{display:none}
  #sound:focus-visible{outline:3px solid rgba(120,80,160,.5);outline-offset:3px}

  #intro{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top, 0px) + 8.5vh);padding:0 18px;text-align:center;pointer-events:none;
    transition:opacity .45s ease, transform .6s ease}
  #intro h1{margin:0;font:700 clamp(32px,8.8vw,60px)/1.05 var(--serif);color:#563a51;letter-spacing:.2px;text-wrap:balance;
    text-shadow:0 2px 0 rgba(255,250,240,.7), 0 0 26px rgba(255,247,234,.95)}
  #intro p{margin:.45em 0 0;font:italic 600 clamp(18px,5vw,26px)/1.2 var(--serif);color:#7a5b6e;text-shadow:0 0 16px rgba(255,247,234,.95)}
  #intro.gone{opacity:0;transform:translateY(-14px)}

  #final{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top, 0px) + 10vh);padding:0 18px;text-align:center;pointer-events:none;
    opacity:0;transform:translateY(10px);transition:opacity .8s ease, transform .8s ease}
  #final h2{margin:0;font:700 clamp(32px,8.8vw,58px)/1.08 var(--serif);color:#563a51;text-wrap:balance;
    text-shadow:0 2px 0 rgba(255,250,240,.75), 0 0 26px rgba(255,244,222,.95)}
  #final.show{opacity:1;transform:none}
  #final p{margin:.45em 0 0;font:italic 600 clamp(17px,4.8vw,24px)/1.25 var(--serif);color:#7a5b6e;text-shadow:0 0 16px rgba(255,247,234,.95)}

  #hint{position:fixed;left:0;top:0;padding:10px 16px;border-radius:20px;background:rgba(255,250,242,.92);color:#5b3f55;
    font:600 17px/1 var(--sans);white-space:nowrap;box-shadow:0 6px 18px rgba(120,80,100,.18);pointer-events:none;opacity:0;transition:opacity .4s ease}
  #hint::after{content:"";position:absolute;left:50%;margin-left:-7px;bottom:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid rgba(255,250,242,.92)}
  #hint.below::after{bottom:auto;top:-7px;border-top:0;border-bottom:7px solid rgba(255,250,242,.92)}
  #hint.show{opacity:1}

  .big{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);transform:translateX(-50%);
    min-width:min(80vw,330px);min-height:64px;padding:0 30px;margin:0;border:none;border-radius:32px;
    font:700 22px/1 var(--serif);color:#4f3349;background:linear-gradient(180deg,#ffe4d0 0%,#f8b6c7 100%);
    box-shadow:0 10px 26px rgba(170,95,120,.30), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(200,110,140,.25);
    cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;transition:opacity .45s ease, transform .45s ease}
  .big:active{transform:translateX(-50%) scale(.96)}
  .big.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(16px)}
  .big:focus-visible{outline:3px solid rgba(120,80,160,.55);outline-offset:4px}
  .big.breathe{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{
    0%,100%{box-shadow:0 10px 26px rgba(170,95,120,.30), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(200,110,140,.25)}
    50%{box-shadow:0 10px 34px rgba(240,160,120,.55), 0 0 0 6px rgba(255,232,200,.45), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(200,110,140,.25)}
  }

  #probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px)}

  @media (max-height:520px){
    #intro{top:calc(env(safe-area-inset-top, 0px) + 12px)}
    #intro h1{font:700 clamp(26px,7.4vh,42px)/1.04 var(--serif)}
    #intro p{font:italic 600 clamp(16px,4.6vh,22px)/1.2 var(--serif);margin-top:.3em}
    #final{top:calc(env(safe-area-inset-top, 0px) + 14px)}
    #final h2{font:700 clamp(26px,7.6vh,44px)/1.05 var(--serif)}
    #final p{font:italic 600 clamp(15px,4.4vh,20px)/1.2 var(--serif);margin-top:.25em}
    .big{bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);min-height:56px}
  }
  @media (prefers-reduced-motion: reduce){
    .big.breathe{animation:none}
    #cnt.pop{animation:none}
    #intro,#final,.big,#counter,#hint{transition-duration:.25s}
  }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="Рассветный луг и кокон на стебельке"></canvas>

<div id="counter" class="pill" role="status" aria-live="polite" aria-label="Пыльца: 0 из 18">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <defs><radialGradient id="pg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff7cc"/><stop offset=".6" stop-color="#f4c14f"/><stop offset="1" stop-color="#e09a32"/></radialGradient></defs>
    <circle cx="12" cy="12" r="11" fill="#ffe6a0" opacity=".45"/>
    <ellipse cx="12" cy="12.5" rx="5.4" ry="7" fill="url(#pg)"/>
    <ellipse cx="10.4" cy="9.6" rx="1.6" ry="2.2" fill="#fffbe8" opacity=".9"/>
  </svg>
  <span class="num"><span id="cnt">0</span><span class="of">/18</span></span>
</div>

<button id="sound" class="pill" type="button" aria-label="Включить звук" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="3.5,9.5 7.5,9.5 12,5.5 12,18.5 7.5,14.5 3.5,14.5" fill="currentColor" stroke="none"/>
    <g class="off"><line x1="15.5" y1="9.5" x2="20.5" y2="14.5"/><line x1="20.5" y1="9.5" x2="15.5" y2="14.5"/></g>
    <g class="on"><path d="M15.5 9.2 A4 4 0 0 1 15.5 14.8"/><path d="M18.2 6.6 A7.6 7.6 0 0 1 18.2 17.4"/></g>
  </svg>
</button>

<div id="intro"><h1>Крылья на рассвете</h1><p>Кто спит в коконе?</p></div>
<div id="final" aria-hidden="true"><h2>Ты разбудила луг!</h2><p id="finalSub">Друзей луга найдено: 0 из 4</p></div>
<div id="hint" aria-hidden="true">Коснись цветка</div>
<button id="open" class="big breathe" type="button">Открыть кокон</button>
<button id="again" class="big hide" type="button" disabled aria-hidden="true" tabindex="-1">Ещё раз</button>
<div id="probe"></div>

<script>
(function(){
'use strict';

/* ================= помощники ================= */
const TAU = Math.PI * 2;
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function span(t, a, b){ return clamp((t - a) / (b - a), 0, 1); }
function ease(t){ t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function easeOut(t){ t = clamp(t, 0, 1); const u = 1 - t; return 1 - u * u * u; }
function easeInOut(t){ t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function backOut(t){ t = clamp(t, 0, 1); const c = 1.6, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; }
function approach(v, to, step){ return v < to ? Math.min(to, v + step) : Math.max(to, v - step); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function pick(list){ return list[(Math.random() * list.length) | 0]; }
const hyp = Math.hypot;
function hex(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixc(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function css(c, al){
  const r = Math.round(c[0]), g = Math.round(c[1]), bl = Math.round(c[2]);
  return al === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + al + ')';
}
function prng(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================= элементы ================= */
const $ = function(id){ return document.getElementById(id); };
const cv = $('scene');
const ctx = cv.getContext('2d', { alpha: false });
const landCv = document.createElement('canvas');
const landx = landCv.getContext('2d');
const cloudCv = document.createElement('canvas');
const cloudx = cloudCv.getContext('2d');
const elCounter = $('counter'), elCnt = $('cnt'), elSound = $('sound'), elIntro = $('intro');
const elFinal = $('final'), elHint = $('hint'), elOpen = $('open'), elAgain = $('again'), elProbe = $('probe'), elFinalSub = $('finalSub');

/* уменьшение движения */
const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
let calm = !!(mq && mq.matches);
if (mq){
  const onMq = function(e){ calm = !!e.matches; };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
}

/* ================= палитра ================= */
const MIST = hex('#efe4e6');
const STEM = hex('#7ba366');
const LEAF = hex('#88ae6f');
const KIND = [
  { n: 5, shape: 0, w: 0.80, petal: hex('#f59bbb'), light: hex('#ffdde8'), edge: hex('#d8789d'), mid: hex('#ffe28e'), mid2: hex('#eda84a') },
  { n: 8, shape: 1, w: 0.42, petal: hex('#b99be6'), light: hex('#ece2fc'), edge: hex('#8c70c6'), mid: hex('#ffe9a8'), mid2: hex('#e5b25a') },
  { n: 6, shape: 2, w: 0.64, petal: hex('#f5c457'), light: hex('#fff2bf'), edge: hex('#d39430'), mid: hex('#cb8a45'), mid2: hex('#94592a') }
];
const DECO = [
  { n: 8, shape: 1, w: 0.42, petal: hex('#fff7ef'), light: hex('#ffffff'), edge: hex('#dfd1c4'), mid: hex('#ffd76a'), mid2: hex('#e8a640') },
  { n: 5, shape: 0, w: 0.80, petal: hex('#f8c2a2'), light: hex('#ffe7d8'), edge: hex('#df987a'), mid: hex('#ffe28e'), mid2: hex('#e7a34a') },
  { n: 5, shape: 0, w: 0.80, petal: hex('#f7b9cd'), light: hex('#ffe4ed'), edge: hex('#d989a7'), mid: hex('#fff0b0'), mid2: hex('#e9b15a') },
  { n: 6, shape: 2, w: 0.60, petal: hex('#cdb7ee'), light: hex('#f2eafd'), edge: hex('#9e85cf'), mid: hex('#ffe6a0'), mid2: hex('#e2ac55') },
  { n: 6, shape: 2, w: 0.60, petal: hex('#f7dc8c'), light: hex('#fff6d2'), edge: hex('#d6af52'), mid: hex('#d8944a'), mid2: hex('#a1642f') }
];
const BUT = {
  pinkOut: hex('#f491b5'), pinkIn: hex('#ffe4ed'), pinkEdge: hex('#d8709a'), lilacEdge: hex('#9f7fdc'),
  goldOut: hex('#efb646'), goldIn: hex('#fff2c6'), goldEdge: hex('#d4952a')
};
const GOLDS = ['#ffd66b', '#ffe59a', '#f5bf4c', '#fff1c2'];
const LILACS = ['#c9b2f0', '#a98be0', '#e6dafb', '#ffe59a'];
const PINKS = ['#ffd0de', '#ffe59a', '#f7a8c4', '#fff1c2'];
const DAWN = [hex('#e3d5ec'), hex('#f1e0ea'), hex('#fde4d4'), hex('#fff1de')];
const MORN = [hex('#d3e2f1'), hex('#e9eef0'), hex('#fdf0da'), hex('#fff7e6')];
const SKY_AT = [0, 0.38, 0.72, 1];
const RAINBOW = ['#f7b2c4', '#f9cfa6', '#f8e7a2', '#c9e2b2', '#b9d8ef', '#cdbbea'];
const FRIEND_KINDS = ['ladybug', 'snail', 'hedgehog', 'bunny'];
const HINTS = { touch: 'Коснись цветка', sleep: 'Посиди на бутоне', 'catch': 'Лови пыльцу!' };

/* ================= раскладка ================= */
let W = 0, H = 0, DPR = 1, S = 1, BS = 1, groundY = 0;
const safe = { t: 0, r: 0, b: 0, l: 0 };
const field = { l: 0, t: 0, r: 0, b: 0, w: 1, h: 1 };
const lim = { l: 0, t: 0, r: 0, b: 0 };
const coc = { x: 0, y: 0, s: 1, baseX: 0 };
let hudRects = [], stemPts = [], finalBottom = 0, againTop = 0;
let dew = [], blades = [], motes = [];
let cocGrad = null, cocIn = null, grainG = null;

function readSafe(){
  const cs = getComputedStyle(elProbe);
  const v = [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingRight) || 0, parseFloat(cs.paddingBottom) || 0, parseFloat(cs.paddingLeft) || 0];
  const changed = v[0] !== safe.t || v[1] !== safe.r || v[2] !== safe.b || v[3] !== safe.l;
  safe.t = v[0]; safe.r = v[1]; safe.b = v[2]; safe.l = v[3];
  return changed;
}

function computeLayout(){
  const land = W > H;
  S = clamp(Math.min(W, H * 0.78) / 390, 0.62, 1.6);
  BS = 0.92 * S;
  groundY = Math.round(H * (land ? 0.36 : 0.40));
  coc.s = 1.08 * S;
  coc.x = W * 0.5;
  coc.y = H * (land ? 0.56 : 0.53);
  coc.baseX = coc.x + 26 * S;
  lim.l = safe.l + 24 * S; lim.r = W - safe.r - 24 * S;
  lim.t = safe.t + 28 * S; lim.b = H - safe.b - 22 * S;
  hudRects = [elCounter, elSound].map(function(el){
    const r = el.getBoundingClientRect();
    return { l: r.left - 16, t: r.top - 16, r: r.right + 16, b: r.bottom + 16 };
  });
  const hudB = Math.max(hudRects[0].b, hudRects[1].b);
  field.l = safe.l + 36 * S; field.r = W - safe.r - 36 * S;
  field.t = Math.max(groundY + 14 * S, hudB + 18);
  field.b = H - safe.b - 64 * S;
  if (field.b - field.t < 120) field.t = Math.max(hudB + 8, field.b - 120);
  field.w = Math.max(1, field.r - field.l); field.h = Math.max(1, field.b - field.t);
  // точки стебля кокона (для расстановки цветов)
  stemPts = [];
  const x0 = coc.baseX, y0 = H + 12, ax = coc.x, ay = coc.y + 26 * coc.s;
  const cx = x0 - 36 * S, cy = (ay + y0) / 2 + 16 * S;
  for (let i = 0; i <= 12; i++){
    const q = i / 12;
    stemPts.push({ x: (1 - q) * (1 - q) * x0 + 2 * (1 - q) * q * cx + q * q * ax, y: (1 - q) * (1 - q) * y0 + 2 * (1 - q) * q * cy + q * q * ay });
  }
  const fr = elFinal.getBoundingClientRect();
  finalBottom = fr.bottom - 10;
  againTop = elAgain.getBoundingClientRect().top - 16;
}

let lastW = -1, lastH = -1, lastD = -1;
function checkDims(){
  const w = window.innerWidth || document.documentElement.clientWidth;
  const h = window.innerHeight || document.documentElement.clientHeight;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  if (w !== lastW || h !== lastH || d !== lastD){ lastW = w; lastH = h; lastD = d; relayout(w, h, d); }
}

function relayout(w, h, d){
  const oldW = W, oldH = H;
  const rx = oldW ? b.x / oldW : 0.5, ry = oldH ? b.y / oldH : 0.5;
  W = w; H = h; DPR = d;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  readSafe();
  computeLayout();
  makePaints();
  paintBackdrop();
  makeDew(); makeBlades(); makeMotes();
  remapWorld();
  if (oldW && b.vis){ b.x = clamp(rx * W, lim.l, lim.r); b.y = clamp(ry * H, lim.t, lim.b); b.vx = 0; b.vy = 0; }
  ptr.target = null;
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].kind !== 2) { parts[i] = parts[parts.length - 1]; parts.pop(); }
  if (G.hint) placeHint();
}

function makePaints(){
  cocGrad = ctx.createLinearGradient(-15, 0, 15, 0);
  cocGrad.addColorStop(0, '#c7a983'); cocGrad.addColorStop(0.5, '#e8d0ab'); cocGrad.addColorStop(1, '#fbead2');
  cocIn = ctx.createRadialGradient(0, -10, 1, 0, -6, 20);
  cocIn.addColorStop(0, '#e3c696'); cocIn.addColorStop(1, '#a07e58');
  grainG = ctx.createRadialGradient(-1.6, -2.2, 0.4, 0, 0, 7.2);
  grainG.addColorStop(0, '#fffbe6'); grainG.addColorStop(0.5, '#f8d468'); grainG.addColorStop(1, '#e59d36');
}

/* ================= фон (рисуется один раз на размер) ================= */
function paintBackdrop(){
  cloudCv.width = landCv.width = cv.width; cloudCv.height = landCv.height = cv.height;
  const R = prng(20261122);
  let g = cloudx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  for (let i = 0; i < 5; i++){
    const cx = R() * W, cy = groundY * (0.16 + R() * 0.5), cw = (60 + R() * 120) * S;
    const tint = R() < 0.5 ? '255,240,236' : '246,232,246';
    for (let k = 0; k < 4; k++){
      g.fillStyle = 'rgba(' + tint + ',' + (0.35 + R() * 0.25).toFixed(2) + ')';
      g.beginPath(); g.ellipse(cx + (k - 1.5) * cw * 0.28, cy - Math.sin(k * 1.3) * cw * 0.06, cw * (0.22 + R() * 0.12), cw * (0.07 + R() * 0.05), 0, 0, TAU); g.fill();
    }
  }
  g = landx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  const layers = [
    { y: groundY - H * 0.10, a: H * 0.030, col: '#d9cedd', mist: 0.55, trees: 0, tc: '#c9c3d2' },
    { y: groundY - H * 0.062, a: H * 0.026, col: '#cad1c1', mist: 0.45, trees: 5, tc: '#b4c0ab' },
    { y: groundY - H * 0.028, a: H * 0.018, col: '#b8c9a6', mist: 0.32, trees: 4, tc: '#9db290' }
  ];
  for (let i = 0; i < layers.length; i++) hill(g, layers[i], R, i);

}

function hill(g, L, R, idx){
  const p1 = R() * TAU, p2 = R() * TAU, p3 = R() * TAU;
  const f1 = TAU / (W * (0.9 + R() * 0.5)), f2 = TAU / (W * (0.35 + R() * 0.2)), f3 = TAU / (W * 0.17);
  const yAt = function(x){ return L.y - L.a * (0.6 * Math.sin(x * f1 + p1) + 0.3 * Math.sin(x * f2 + p2) + 0.1 * Math.sin(x * f3 + p3)); };
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, yAt(x));
  g.lineTo(W, H); g.closePath();
  g.fillStyle = L.col; g.fill();
  for (let k = 0; k < L.trees; k++){
    const tx = R() * W, ty = yAt(tx) + 2, tr = (4 + R() * 4) * S * (0.7 + idx * 0.35);
    g.fillStyle = L.tc;
    g.fillRect(tx - tr * 0.12, ty - tr * 0.9, tr * 0.24, tr * 0.9);
    g.beginPath(); g.arc(tx, ty - tr * 1.35, tr, 0, TAU); g.arc(tx - tr * 0.6, ty - tr * 1.0, tr * 0.7, 0, TAU); g.arc(tx + tr * 0.6, ty - tr * 1.05, tr * 0.72, 0, TAU); g.fill();
  }
  const top = L.y + L.a * 0.2;
  const mg = g.createLinearGradient(0, top - H * 0.03, 0, top + H * 0.06);
  mg.addColorStop(0, 'rgba(255,246,238,0)'); mg.addColorStop(0.45, 'rgba(255,244,236,' + L.mist + ')'); mg.addColorStop(1, 'rgba(255,244,236,0)');
  g.fillStyle = mg; g.fillRect(0, top - H * 0.03, W, H * 0.09);
}

function meadow(g, R){
  const p = R() * TAU;
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, groundY - H * 0.008 * Math.sin(x * TAU / (W * 0.8) + p));
  g.lineTo(W, H); g.closePath();
  let gr = g.createLinearGradient(0, groundY - H * 0.01, 0, H);
  gr.addColorStop(0, '#b4c99a'); gr.addColorStop(0.35, '#9fbc84'); gr.addColorStop(1, '#7ca468');
  g.fillStyle = gr; g.fill();
  // дымка у кромки луга
  gr = g.createLinearGradient(0, groundY - H * 0.02, 0, groundY + H * 0.07);
  gr.addColorStop(0, 'rgba(255,245,235,.5)'); gr.addColorStop(1, 'rgba(255,245,235,0)');
  g.fillStyle = gr; g.fillRect(0, groundY - H * 0.02, W, H * 0.09);
  // мягкие пятна света и тени
  for (let i = 0; i < 7; i++){
    const d = R();
    const x = R() * W, y = groundY + (0.1 + d * 0.85) * (H - groundY);
    const rw = (90 + R() * 160) * S * (0.5 + d), rh = rw * 0.22;
    const pg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    pg.addColorStop(0, i % 2 ? 'rgba(70,100,60,.10)' : 'rgba(255,240,200,.16)'); pg.addColorStop(1, i % 2 ? 'rgba(70,100,60,0)' : 'rgba(255,240,200,0)');
    g.save(); g.translate(x, y); g.scale(rw, rh); g.fillStyle = pg; g.beginPath(); g.arc(0, 0, 1, 0, TAU); g.fill(); g.restore();
  }
  // травинки (мелкие вдали, крупные вблизи)
  const n = Math.round(W * (H - groundY) / 260);
  for (let i = 0; i < n; i++){
    const d = Math.pow(R(), 0.8);
    const y = groundY + d * (H - groundY) + 2;
    const x = R() * W;
    const len = (2 + 13 * d * d + R() * 4 * d) * S;
    const lean = (R() - 0.5) * len * 0.6;
    const sh = R();
    g.strokeStyle = sh < 0.5 ? 'rgba(110,148,90,' + (0.25 + 0.35 * d).toFixed(2) + ')'
      : (sh < 0.85 ? 'rgba(152,184,120,' + (0.25 + 0.3 * d).toFixed(2) + ')' : 'rgba(236,240,204,' + (0.18 + 0.2 * d).toFixed(2) + ')');
    g.lineWidth = (0.6 + 1.1 * d) * S;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.2, y - len * 0.6, x + lean, y - len); g.stroke();
  }
  // далёкие цветочки-точки
  const cols = ['#f6b6c9', '#d6c2ef', '#fff3dc', '#f9d29a'];
  const m = Math.round(W / 5);
  for (let i = 0; i < m; i++){
    const d = R() * 0.35, y = groundY + d * (H - groundY) + 3, x = R() * W;
    g.globalAlpha = 0.5 + 0.35 * d;
    g.fillStyle = cols[(R() * cols.length) | 0];
    g.beginPath(); g.arc(x, y, (0.7 + R() * 1.1 + d * 2) * S, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  // тёплый свет со стороны солнца
  gr = g.createRadialGradient(W * 0.7, groundY, 0, W * 0.7, groundY, Math.max(W, H) * 0.7);
  gr.addColorStop(0, 'rgba(255,236,200,.28)'); gr.addColorStop(1, 'rgba(255,236,200,0)');
  g.fillStyle = gr; g.fillRect(0, groundY - 10, W, H);
  // мягкая виньетка
  gr = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.85);
  gr.addColorStop(0, 'rgba(110,70,90,0)'); gr.addColorStop(1, 'rgba(110,70,90,.12)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

/* ================= цветы ================= */
function clearOf(x, y){
  for (let i = 0; i < hudRects.length; i++){
    const r = hudRects[i];
    if (x > r.l && x < r.r && y > r.t && y < r.b) return false;
  }
  if (hyp(x - coc.x, y - coc.y) < 72 * S) return false;
  for (let i = 0; i < stemPts.length; i++) if (hyp(x - stemPts[i].x, y - stemPts[i].y) < 30 * S) return false;
  return true;
}
function minGap(){ return clamp(Math.sqrt(field.w * field.h / 18) * 0.6, 40, 110 * S); }

function bestSpot(pts, o){
  let best = null, bs = -Infinity;
  const gap = minGap();
  for (let k = 0; k < o.tries; k++){
    const x = rnd(field.l, field.r), y = rnd(field.t, field.b);
    if (!clearOf(x, y)) continue;
    let m = 1e9; for (const q of pts){ const d = hyp(q.x - x, q.y - y); if (d < m) m = d; }
    let md = 1e9; for (const q of decos){ const d = hyp(q.x - x, q.y - y); if (d < md) md = d; }
    let mf = 1e9; for (const q of friends){ const d = hyp(q.x - x, q.y - 12 * S - y); if (d < mf) mf = d; }
    let sc;
    if (o.near) sc = -Math.abs(hyp(x - o.near.x, y - o.near.y) - o.nearD) - (m < gap ? 500 : 0) - (md < 22 * S ? 60 : 0) - (y < o.near.y + 120 * S ? 120 : 0) - (mf < 66 * S ? 300 : 0);
    else sc = Math.min(m, md * 2.4 + gap * 0.4, mf < 66 * S ? mf * 0.3 : mf * 1.1);
    if (sc > bs){ bs = sc; best = { x: x, y: y }; }
  }
  return best || { x: (field.l + field.r) / 2 + rnd(-20, 20), y: (field.t + field.b) / 2 + rnd(-20, 20) };
}

function spotNear(f, placed, gap){
  let best = null, bs = -Infinity;
  for (let k = 0; k < 70; k++){
    const x = rnd(field.l, field.r), y = rnd(field.t, field.b);
    if (!clearOf(x, y)) continue;
    let m = 1e9; for (const o of placed){ const d = hyp(o.x - x, o.y - y); if (d < m) m = d; }
    const sc = (m >= gap ? 10000 : m * 10) - hyp(x - f.x, y - f.y);
    if (sc > bs){ bs = sc; best = { x: x, y: y }; }
  }
  return best || { x: clamp(f.x, field.l, field.r), y: clamp(f.y, field.t, field.b) };
}

function makeFlower(x, y, group, idx){
  const f = {
    seed: true, group: group, mode: group, idx: idx, kind: KIND[group], st: 0, g: 0, open: 0.32, bt: 0, pulse: -1,
    wake: 0, tick: 0, airX: x, airY: y, puffed: false,
    ph: rnd(0, TAU), sc: rnd(0.93, 1.1), lean: rnd(-1, 1), stem: rnd(0.85, 1.15), rot: rnd(-0.3, 0.3),
    leafSide: Math.random() < 0.5 ? -1 : 1, x: x, y: y, hx: x, hy: y,
    u: (x - field.l) / field.w, v: (y - field.t) / field.h
  };
  look(f); return f;
}
function makeDeco(x, y){
  const f = {
    seed: false, kind: pick(DECO), st: Math.random() < 0.4 ? 6 : 4, g: 1, open: 0.62, bt: 0, woke: false, pulse: -1,
    ph: rnd(0, TAU), sc: rnd(0.8, 1.15), lean: rnd(-1, 1), stem: rnd(0.6, 1), rot: rnd(-0.4, 0.4),
    leafSide: Math.random() < 0.5 ? -1 : 1, x: x, y: y, hx: x, hy: y,
    u: x / W, v: (y - groundY) / Math.max(1, H - groundY)
  };
  look(f); return f;
}
function look(f){
  f.depth = clamp((f.y - groundY) / Math.max(1, H - groundY), 0, 1);
  f.s = (f.seed ? S * (0.74 + 0.46 * f.depth) : S * (0.34 + 0.56 * f.depth)) * f.sc;
  const k = (1 - f.depth) * 0.34, K = f.kind;
  const cP = mixc(K.petal, MIST, k), cL = mixc(K.light, MIST, k * 0.6);
  const cM = mixc(K.mid, MIST, k * 0.5), cM2 = mixc(K.mid2, MIST, k * 0.5);
  f.sEdge = css(mixc(K.edge, MIST, k));
  f.sLight = css(cL);
  f.sStem = css(mixc(STEM, MIST, k * 0.8));
  f.sLeaf = css(mixc(LEAF, MIST, k * 0.8));
  f.sBud = css(mixc(mixc(K.petal, STEM, 0.45), MIST, k));
  f.sBudLive = css(mixc(K.petal, MIST, k * 0.6));
  f.gP = ctx.createRadialGradient(0, 0, 1, 0, 0, 21);
  f.gP.addColorStop(0, css(cL)); f.gP.addColorStop(0.5, css(mixc(cL, cP, 0.6))); f.gP.addColorStop(1, css(cP));
  f.gM = ctx.createRadialGradient(-1.5, -1.5, 0.5, 0, 0, 6.5);
  f.gM.addColorStop(0, css(mixc(cM, [255, 255, 240], 0.4))); f.gM.addColorStop(1, css(cM2));
}
function sortSeeds(){ seedOrder = flowers.slice().sort(function(a, c){ return a.y - c.y; }); }

function planDecos(){
  decos = [];
  const n = Math.round(clamp(W * (H - groundY) / 8500, 16, 46));
  const pts = [];
  for (let i = 0; i < n; i++){
    let best = null, bs = -1;
    for (let k = 0; k < 16; k++){
      const x = rnd(safe.l + 10, W - safe.r - 10), y = rnd(groundY + 8 * S, H - 20 * S);
      if (hyp(x - coc.x, y - coc.y) < 56 * S) continue;
      let m = 1e9; for (const q of pts){ const d = hyp(q.x - x, q.y - y); if (d < m) m = d; }
      if (m > bs){ bs = m; best = { x: x, y: y }; }
    }
    if (!best) continue;
    pts.push(best);
    decos.push(makeDeco(best.x, best.y));
  }
  decos.sort(function(a, c){ return a.y - c.y; });
}

function planSeeds(){
  flowers = [];
  const P0 = startPoint();
  const pts = [];
  for (let i = 0; i < 18; i++){
    const p = i === 0
      ? bestSpot(pts, { near: P0, nearD: clamp(field.h * 0.5, 130 * S, 190 * S), tries: 140 })
      : bestSpot(pts, { tries: 40 });
    pts.push(p);
    flowers.push(makeFlower(p.x, p.y, Math.floor(i / 6), i));
  }
  sortSeeds();
}

function remapWorld(){
  for (const d of decos){ d.x = d.u * W; d.y = groundY + d.v * (H - groundY); look(d); }
  decos.sort(function(a, c){ return a.y - c.y; });
  for (const fr of friends){ fr.x = fr.u * W; fr.y = groundY + fr.v * (H - groundY); lookFriend(fr); }
  friends.sort(function(a, c){ return a.y - c.y; });
  if (!flowers.length) return;
  for (const f of flowers){ f.x = field.l + f.u * field.w; f.y = field.t + f.v * field.h; }
  const gap = minGap();
  const placed = flowers.filter(function(f){ return f.st === 3; });
  for (const f of flowers){
    if (f.st === 3) continue;
    let ok = clearOf(f.x, f.y) && f.x >= field.l && f.x <= field.r && f.y >= field.t && f.y <= field.b;
    if (ok) for (const o of placed){ if (hyp(o.x - f.x, o.y - f.y) < gap){ ok = false; break; } }
    if (!ok){
      const p = spotNear(f, placed, gap);
      f.x = p.x; f.y = p.y; f.u = (f.x - field.l) / field.w; f.v = (f.y - field.t) / field.h;
    }
    placed.push(f);
  }
  for (const f of flowers){ look(f); if (f.st === 7){ f.sx0 = f.x; f.sy0 = f.y; } }
  sortSeeds();
}

function spawnGroup(gi){

function updParts(dt){
  const f60 = dt * 60;
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    const dr = p.drag === 1 ? 1 : Math.pow(p.drag, f60);
    p.vx *= dr; p.vy = p.vy * dr + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 2) p.x += Math.sin(G.t * 2 + p.ph) * 8 * S * dt;
  }
}

function star(x, y, r){

/* ---------- цветок ---------- */
function petalPath(shape, a, L, pw){
  const c = Math.cos(a), s = Math.sin(a);
  if (shape === 2){
    const rp = function(x, y){ return [x * c - y * s, x * s + y * c]; };
    const p1 = rp(pw * 0.9, -L * 0.45), p2 = rp(0, -L * 1.05), p3 = rp(-pw * 0.9, -L * 0.45);
    ctx.moveTo(0, 0); ctx.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]); ctx.quadraticCurveTo(p3[0], p3[1], 0, 0);
  } else {
    const d = L * (shape === 0 ? 0.52 : 0.55), rx = pw * 0.5, ry = d;
    const cx = s * d, cy = -c * d;
    ctx.moveTo(cx + rx * c, cy + rx * s);
    ctx.ellipse(cx, cy, rx, ry, a, 0, TAU);
  }
}
function head(f, open, alpha){
  const K = f.kind, n = K.n;
  const L = 20 * (0.5 + 0.5 * open), pw = 20 * K.w * (0.72 + 0.28 * open);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = f.gP;
  ctx.beginPath();
  for (let i = 0; i < n; i++) petalPath(K.shape, i * TAU / n, L, pw);
  ctx.fill();
  ctx.lineWidth = 1.1; ctx.strokeStyle = f.sEdge; ctx.globalAlpha = alpha * 0.5; ctx.stroke();
  if (open > 0.72){
    ctx.globalAlpha = alpha * clamp((open - 0.72) / 0.28, 0, 1);
    ctx.fillStyle = f.sLight;
    ctx.beginPath();
    for (let i = 0; i < n; i++) petalPath(K.shape, i * TAU / n + Math.PI / n, L * 0.62, pw * 0.7);
    ctx.fill();
  }
  ctx.globalAlpha = alpha;
  ctx.fillStyle = f.gM;
  ctx.beginPath(); ctx.arc(0, 0, 4.4 + 1.4 * open, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,250,225,.8)';
  ctx.beginPath(); ctx.arc(-1.6, -1.2, 0.8, 0, TAU); ctx.arc(1.4, -0.4, 0.7, 0, TAU); ctx.arc(-0.2, 1.6, 0.7, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function bud(f, alpha, col){
  if (alpha <= 0.01) return;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = f.sStem;
  ctx.beginPath(); ctx.moveTo(-5, 2); ctx.quadraticCurveTo(-7, -4, -1, -6); ctx.lineTo(1, -6); ctx.quadraticCurveTo(7, -4, 5, 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col || f.sBud;
  ctx.beginPath(); ctx.moveTo(0, -17); ctx.quadraticCurveTo(7, -9, 4.5, -1); ctx.quadraticCurveTo(0, 2, -4.5, -1); ctx.quadraticCurveTo(-7, -9, 0, -17); ctx.fill();
  ctx.strokeStyle = f.sEdge; ctx.lineWidth = 1; ctx.globalAlpha = alpha * 0.45; ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawFlower(f, t){
  if (f.st === 0) return;
  const gr = f.st === 1 ? f.g : 1;
  if (gr <= 0.001) return;
  const grs = f.st === 1 ? (calm ? ease(gr) : backOut(gr)) : 1;
  const s = f.s, g1 = Math.min(1, gr);
  const sway = (calm ? 0 : Math.sin(t * 1.1 + f.ph) * 0.045) + G.bend * (0.6 + 0.4 * f.depth);
  const len = (f.seed ? (36 + 30 * f.depth) : (18 + 22 * f.depth)) * S * f.stem;
  const bx = f.x - f.lean * len * 0.18, by = f.y + len;
  const hx = lerp(bx, f.x + sway * len, g1), hy = lerp(by, f.y, g1);
  f.hx = hx; f.hy = hy;
  ctx.fillStyle = 'rgba(60,92,52,.12)';
  ctx.beginPath(); ctx.ellipse(bx, by, 8 * s, 2.4 * s, 0, 0, TAU); ctx.fill();
  const cx = bx + (hx - bx) * 0.3 + f.lean * 5 * s, cy = (by + hy) / 2;
  ctx.strokeStyle = f.sStem; ctx.lineWidth = Math.max(1.2, 2.4 * s); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(cx, cy, hx, hy); ctx.stroke();
  if (gr > 0.45){
    const q = 0.42;
    const lx = (1 - q) * (1 - q) * bx + 2 * (1 - q) * q * cx + q * q * hx;
    const ly = (1 - q) * (1 - q) * by + 2 * (1 - q) * q * cy + q * q * hy;
    leaf(lx, ly, f.leafSide > 0 ? -0.55 : Math.PI + 0.55, 13 * s * Math.min(1, (gr - 0.45) / 0.4), f.sLeaf);
  }
  // мягкое свечение только что раскрывшегося цветка
  if (f.st === 3 && f.bt < 1.4){
    const a = 0.5 * (1 - f.bt / 1.4), rr = 30 * s;
    const hg = ctx.createRadialGradient(hx, hy, 2, hx, hy, rr);
    hg.addColorStop(0, 'rgba(255,240,190,' + a.toFixed(3) + ')'); hg.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, rr, 0, TAU); ctx.fill();
  }
  ctx.save(); ctx.translate(hx, hy);
  let k = s * grs;
  if (f.pulse >= 0 && f.pulse < 0.8 && !calm) k *= 1 + 0.14 * Math.sin(Math.PI * clamp(f.pulse / 0.7, 0, 1));
  ctx.scale(k, k); ctx.rotate(f.rot + sway * 0.8);
  if (f.seed && f.mode === 1 && (f.st === 1 || f.st === 2)) sleepyBud(f);
  else if (f.st === 4) bud(f, 1);
  else if (f.st === 6) head(f, 0.62 + (f.woke ? 0.4 * (calm ? ease(f.bt) : backOut(f.bt)) : 0), 1);
  else if (f.st === 5){
    const w = f.bt;
    bud(f, 1 - ease(w * 1.6));
    ctx.save(); const hs = lerp(0.4, 1, easeOut(w)); ctx.scale(hs, hs);
    head(f, calm ? ease(w) : backOut(w), ease(span(w, 0, 0.4)));
    ctx.restore();
  } else head(f, f.open, 1);
  ctx.restore();
}

/* ---------- пыльца на цветке ---------- */
function drawSeed(f, t){
  const s = f.s * (f.st === 1 ? easeOut(span(f.g, 0.35, 1)) : 1);
  if (s <= 0.01) return;
  const bob = calm ? 0 : Math.sin(t * 2.2 + f.ph) * 2 * S;
  const x = f.hx, y = f.hy + bob;
  const near = f === G.nearest ? 1 : 0;
  const pulse = 0.5 + 0.5 * Math.sin(t * (calm ? 1.4 : 2.6) + f.ph);
  const R = (24 + 5 * pulse + 7 * near) * s;
  const gr = ctx.createRadialGradient(x, y, 0, x, y, R);
  gr.addColorStop(0, 'rgba(255,238,165,.8)');
  gr.addColorStop(0.35, 'rgba(255,214,110,' + (0.34 + 0.12 * pulse + 0.12 * near).toFixed(3) + ')');
  gr.addColorStop(1, 'rgba(255,214,110,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(0.25);
  ctx.fillStyle = grainG; ctx.beginPath(); ctx.ellipse(0, 0, 4.8, 6.3, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(200,130,40,.55)'; ctx.lineWidth = 0.9; ctx.stroke();
  ctx.fillStyle = 'rgba(255,253,236,.95)'; ctx.beginPath(); ctx.ellipse(-1.6, -2.2, 1.4, 2, 0, 0, TAU); ctx.fill();
  ctx.restore();
  if (f.mode === 2) fluff(x, y, s, t, f.ph);
  const tw = Math.pow(0.5 + 0.5 * Math.sin(t * 3.1 + f.ph * 2), 6);
  if (tw > 0.05){ ctx.globalAlpha = tw; ctx.fillStyle = '#fffbe6'; star(x + 8 * s, y - 9 * s, 5.5 * s * (0.6 + 0.4 * tw)); ctx.globalAlpha = 1; }
}

/* ---------- бабочка ---------- */
function foreW(){ ctx.moveTo(1.5, -3); ctx.quadraticCurveTo(6, -31, 30, -35); ctx.quadraticCurveTo(45, -36, 43, -22); ctx.quadraticCurveTo(40, -7, 3, 1); ctx.closePath(); }
function hindW(){ ctx.moveTo(2, 0); ctx.quadraticCurveTo(29, -5, 34, 10); ctx.quadraticCurveTo(37, 26, 21, 30); ctx.quadraticCurveTo(8, 33, 2, 8); ctx.closePath(); }
function dot(x, y, r){ ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }

function wing(hind, sIn, sMid, sOut, sEdge, li, go){
  const path = hind ? hindW : foreW, gy = hind ? 10 : -12;
  ctx.beginPath(); path();
  const gr = ctx.createRadialGradient(3, gy, 1, 3, gy, 44);
  gr.addColorStop(0, sIn); gr.addColorStop(0.5, sMid); gr.addColorStop(1, sOut);
  ctx.fillStyle = gr; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.lineWidth = 7 + 3 * li; ctx.strokeStyle = sEdge; ctx.globalAlpha = 0.9; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,246,222,.93)';
  ctx.beginPath();
  if (hind){ dot(24, 16, 4.2); dot(15, 24, 2.6); dot(30, 6, 2.1); }
  else { dot(31, -25, 4.4); dot(22, -16, 3); dot(38, -16, 2.4); }
  ctx.fill();
  if (go > 0.01){
    ctx.globalAlpha = go;
    ctx.strokeStyle = '#f2bd45'; ctx.lineWidth = 2.1; ctx.lineCap = 'round';
    ctx.beginPath();
    if (hind){ ctx.moveTo(6, 4); ctx.quadraticCurveTo(25, 1, 29, 19); ctx.moveTo(9, 13); ctx.quadraticCurveTo(17, 24, 12, 29); }
    else { ctx.moveTo(6, -6); ctx.quadraticCurveTo(15, -27, 35, -30); ctx.moveTo(10, -4); ctx.quadraticCurveTo(28, -12, 39, -9); }
    ctx.stroke();
    ctx.lineWidth = 1.4; ctx.strokeStyle = '#f6c856';
    ctx.beginPath(); if (hind) ctx.arc(24, 16, 6.2, 0, TAU); else ctx.arc(31, -25, 6.6, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath();
    if (hind){ dot(33, 14, 1.4); dot(30, 24, 1.3); dot(22, 29, 1.2); }
    else { dot(41, -27, 1.4); dot(40, -12, 1.3); dot(24, -32, 1.2); }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.beginPath(); path();
  ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(122,62,92,.38)'; ctx.stroke();
}

function bodyDraw(){
  ctx.fillStyle = '#6d4b62';
  ctx.beginPath(); ctx.ellipse(0, 9, 3.8, 14, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,230,.35)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 3; i++){ ctx.moveTo(-3, 5 + i * 5); ctx.quadraticCurveTo(0, 6.5 + i * 5, 3, 5 + i * 5); }
  ctx.stroke();
  ctx.fillStyle = '#7a566e'; ctx.beginPath(); ctx.ellipse(0, -3, 5, 6.5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#6d4b62'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2.5, -19); ctx.quadraticCurveTo(-4, -28, -10, -31); ctx.moveTo(2.5, -19); ctx.quadraticCurveTo(4, -28, 10, -31); ctx.stroke();
  ctx.fillStyle = '#6d4b62'; ctx.beginPath(); dot(-10.4, -31.4, 2.1); dot(10.4, -31.4, 2.1); ctx.fill();
  ctx.fillStyle = '#86627a'; ctx.beginPath(); ctx.arc(0, -12.5, 8.4, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(-2, -15, 4.5, 0, TAU); ctx.fill();
  const blink = ((G.t + 1.3) % 3.9) < 0.13;
  if (blink){
    ctx.strokeStyle = '#2e2130'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-5.4, -13); ctx.quadraticCurveTo(-3.3, -11.4, -1.2, -13); ctx.moveTo(1.2, -13); ctx.quadraticCurveTo(3.3, -11.4, 5.4, -13); ctx.stroke();
  } else {
    ctx.fillStyle = '#2e2130';
    ctx.beginPath(); ctx.ellipse(-3.3, -13.2, 2.6, 3.1, 0, 0, TAU); ctx.ellipse(3.3, -13.2, 2.6, 3.1, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); dot(-2.4, -14.4, 1.05); dot(4.2, -14.4, 1.05); dot(-4, -12, 0.5); dot(2.6, -12, 0.5); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,150,175,.65)'; ctx.beginPath(); dot(-5.7, -9.4, 1.7); dot(5.7, -9.4, 1.7); ctx.fill();
  ctx.strokeStyle = '#f4cfdc'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(0, -10.2, 1.9, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
}

function drawButterfly(x, y, sc, tilt, open, glow){
  const k = BS * sc;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(k, k);
  if (glow > 0.01){
    const gg = ctx.createRadialGradient(0, 0, 4, 0, 0, 62);
    gg.addColorStop(0, 'rgba(255,232,160,' + (0.5 * glow).toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,232,160,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.fill();
  }
  const gl = G.gilt, li = G.lilac, go = G.gold;
  const cOut = mixc(BUT.pinkOut, BUT.goldOut, gl), cIn = mixc(BUT.pinkIn, BUT.goldIn, gl);
  let cEdge = mixc(BUT.pinkEdge, BUT.lilacEdge, li); cEdge = mixc(cEdge, BUT.goldEdge, gl * 0.8);
  const sOut = css(cOut), sIn = css(cIn), sMid = css(mixc(cIn, cOut, 0.55)), sEdge = css(cEdge);
  const ox = Math.max(0.05, open);
  for (let side = -1; side <= 1; side += 2){
    ctx.save(); ctx.scale(side * ox, 1);
    wing(true, sIn, sMid, sOut, sEdge, li, go);
    wing(false, sIn, sMid, sOut, sEdge, li, go);
    ctx.restore();
  }
  bodyDraw();
  ctx.restore();
}
function flapOpen(open){
  const depth = calm ? 0.34 : 0.66;
  const f = 0.5 + 0.5 * Math.sin(b.ph);
  return open * (1 - b.amp * depth * f);
}
function drawFlyB(){
  const bob = calm ? 0 : Math.cos(b.ph) * 1.4 * S * b.amp;
  const spin = (G.spin >= 0 && !calm) ? TAU * easeInOut(G.spin / 0.75) : 0;
  drawButterfly(b.x, b.y + bob, b.sc, b.tilt + spin, flapOpen(b.open), b.glow);
}

/* ---------- кокон ---------- */
function cocFrame(){
  const sw = calm ? 0 : Math.sin(G.t * 1.25);
  return { ax: coc.x + sw * 2.6 * S, ay: coc.y + 26 * coc.s, rot: G.cocRot + G.twitch + sw * 0.025, sw: sw };
}
function cocApply(F){ ctx.translate(F.ax, F.ay); ctx.rotate(F.rot); ctx.scale(coc.s, coc.s); ctx.translate(0, -26); }
function cocToScreen(F, lx, ly){
  const px = lx * coc.s, py = (ly - 26) * coc.s, c = Math.cos(F.rot), s = Math.sin(F.rot);
  return { x: F.ax + px * c - py * s, y: F.ay + px * s + py * c };
}
function startPoint(){
  return {
    x: clamp(coc.x + 28 * S, lim.l, lim.r),
    y: clamp(coc.y - 27 * coc.s - 72 * S, lim.t + 20 * S, lim.b)
  };
}
function cocoonPath(){
  ctx.beginPath();
  ctx.moveTo(0, -27);
  ctx.quadraticCurveTo(16, -26, 15, -5);
  ctx.quadraticCurveTo(13.5, 15, 2.5, 26);
  ctx.lineTo(-2.5, 26);
  ctx.quadraticCurveTo(-13.5, 15, -15, -5);
  ctx.quadraticCurveTo(-16, -26, 0, -27);
  ctx.closePath();
}
function cocShell(){
  cocoonPath(); ctx.fillStyle = cocGrad; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(255,252,238,.6)'; ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (let i = -3; i <= 3; i++){ const y = i * 7.5; ctx.moveTo(-16, y + 6); ctx.quadraticCurveTo(0, y - 2, 16, y + 4); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(150,112,80,.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6, -24); ctx.quadraticCurveTo(-11, 0, -4, 24); ctx.stroke();
  ctx.restore();
  cocoonPath(); ctx.strokeStyle = 'rgba(112,78,56,.62)'; ctx.lineWidth = 1.3; ctx.stroke();
}
function drawCocoonBody(F, open, layer){
  ctx.save(); cocApply(F);
  if (open < 0.002){ if (layer !== 'back') cocShell(); ctx.restore(); return; }
  if (layer === 'back' || layer === 'all'){ cocoonPath(); ctx.fillStyle = cocIn; ctx.fill(); }
  if (layer === 'front' || layer === 'all'){
    ctx.save(); ctx.beginPath(); ctx.rect(-20, -5, 40, 40); ctx.clip(); cocShell(); ctx.restore();
    for (let sd = -1; sd <= 1; sd += 2){
      ctx.save();
      ctx.translate(sd * 14.5, -5); ctx.rotate(sd * open); ctx.translate(-sd * 14.5, 5);
      ctx.beginPath(); if (sd < 0) ctx.rect(-20, -32, 20, 27.2); else ctx.rect(0, -32, 20, 27.2); ctx.clip();
      cocShell(); ctx.restore();
    }
    ctx.strokeStyle = 'rgba(150,128,90,.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-14.6, -5); ctx.quadraticCurveTo(-7, -2.5, 0, -4.6); ctx.quadraticCurveTo(7, -2.5, 14.6, -5); ctx.stroke();
  }
  ctx.restore();
}
function innerGlow(F){
  if (G.state !== 'birth') return;
  const tt = G.stT, a = 0.7 * span(tt, 0.42, 0.7) * (1 - span(tt, 1.2, 1.8));
  if (a <= 0.01) return;
  ctx.save(); cocApply(F);
  const gg = ctx.createRadialGradient(0, -12, 1, 0, -12, 26);
  gg.addColorStop(0, 'rgba(255,240,186,' + a.toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,240,186,0)');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, -12, 26, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawStem(F){
  const x0 = coc.baseX, y0 = H + 12;
  const cx = x0 - 36 * S + F.sw * 1.5 * S, cy = (F.ay + y0) / 2 + 16 * S;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#6f9a5c'; ctx.lineWidth = 6 * S;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, F.ax, F.ay + 1); ctx.stroke();
  ctx.strokeStyle = 'rgba(206,228,176,.55)'; ctx.lineWidth = 1.6 * S;
  ctx.beginPath(); ctx.moveTo(x0 + 1.5 * S, y0); ctx.quadraticCurveTo(cx + 1.5 * S, cy, F.ax + 1 * S, F.ay + 3); ctx.stroke();
  const P = function(q){ return { x: (1 - q) * (1 - q) * x0 + 2 * (1 - q) * q * cx + q * q * F.ax, y: (1 - q) * (1 - q) * y0 + 2 * (1 - q) * q * cy + q * q * F.ay }; };
  let p = P(0.42); leaf(p.x, p.y, -0.75 + F.sw * 0.05, 38 * S, '#86ae6d');
  p = P(0.7); leaf(p.x, p.y, Math.PI + 0.7 + F.sw * 0.05, 24 * S, '#94ba7b');
  ctx.fillStyle = 'rgba(255,250,236,.85)';
  ctx.beginPath(); ctx.ellipse(F.ax, F.ay + 1, 3.4 * S, 2 * S, F.rot, 0, TAU); ctx.fill();
}

/* поза бабочки во время рождения: чистая функция времени и раскладки */
function birthPose(tt, F){
  const scl = lerp(0.72, 1, ease(span(tt, 1.32, 1.72)));
  const ratio = BS / coc.s;
  const hid = -5 + 20 * 0.72 * ratio;
  const sit = -5 - 20 * scl * ratio;
  const ly = lerp(hid, sit, easeOut(span(tt, 0.5, 1.2)));
  const p = cocToScreen(F, 0, ly);
  let x = p.x, y = p.y, tilt = F.rot;
  const L = span(tt, 1.72, BIRTH_END);
  if (L > 0){
    const e = easeInOut(L), P0 = startPoint();
    x = lerp(p.x, P0.x, e);
    y = lerp(p.y, P0.y, e) - Math.sin(e * Math.PI) * 16 * S;
    tilt = lerp(F.rot, 0, e) + (calm ? 0 : Math.sin(e * Math.PI) * 0.16);
  }
  const t2 = span(tt, 1.32, 1.72);
  const op = lerp(0.12, 1, calm ? ease(t2) : backOut(t2));
  return { x: x, y: y, sc: scl, tilt: tilt, open: op, inside: tt < 1.26 };
}
function drawPose(P){
  const glow = 0.45 * span(G.stT, 1.3, 1.6) * (1 - span(G.stT, 1.8, 2.1));
  const bob = calm ? 0 : Math.cos(b.ph) * 1.4 * S * b.amp;
  drawButterfly(P.x, P.y + bob, P.sc, P.tilt, flapOpen(P.open), glow);
}
function drawCocoonScene(){
  const F = cocFrame();
  drawStem(F);
  if (G.state === 'title' || G.state === 'birth'){
    const a = G.state === 'title' ? 0.32 + 0.1 * Math.sin(G.t * 2) : 0.4 * (1 - span(G.stT, 1.4, 2.1));
    if (a > 0.01){
      const c = cocToScreen(F, 0, -4), r = 74 * S;
      const gg = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, r);
      gg.addColorStop(0, 'rgba(255,228,200,' + a.toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,228,200,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, TAU); ctx.fill();
    }
  }
  if (G.state === 'birth'){
    const P = birthPose(G.stT, F);
    if (P.inside){
      drawCocoonBody(F, G.cocOpen, 'back');
      innerGlow(F);
      ctx.save(); cocApply(F);
      ctx.beginPath(); ctx.rect(-14, -300, 28, 308); ctx.clip();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawPose(P);
      ctx.restore();
      drawCocoonBody(F, G.cocOpen, 'front');
    } else {
      drawCocoonBody(F, G.cocOpen, 'all');
      innerGlow(F);
      drawPose(P);
    }
  } else drawCocoonBody(F, G.cocOpen, 'all');
}

/* ---------- окружение ---------- */
function drawMotes(t){
  ctx.fillStyle = '#fffaf0';
  for (const m of motes){
    const x = calm ? m.x : (m.x + t * 7 * S * m.sp) % (W + 20) - 10;
    const y = m.y + (calm ? 0 : Math.sin(t * 0.6 * m.sp + m.ph) * 10 * S);
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(t * 1.3 + m.ph);
    ctx.beginPath(); ctx.arc(x, y, m.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawDew(t){
  for (const p of dew){
    let a = Math.sin(t * p.sp + p.ph);
    a = a > 0 ? Math.pow(a, calm ? 2 : 10) : 0;
    const r = (1.2 + 2.6 * p.d) * S;

/* ---------- пыльца-пушинка (третий этап) ---------- */

function airBox(){
  const hb = Math.max(hudRects[0].b, hudRects[1].b);

}
function liftSeed(f){

  f.st = 7; f.lt0 = G.t; f.sx0 = f.hx; f.sy0 = f.hy;
  f.w1 = rnd(0.5, 0.8) * (calm ? 0.6 : 1); f.w2 = rnd(0.65, 1.05) * (calm ? 0.6 : 1);
  f.p1 = rnd(0, TAU); f.p2 = rnd(0, TAU); f.lift = rnd(70, 120) * S;
  f.pfx = f.pfy = f.pvx = f.pvy = 0; f.puffed = false;
  f.airX = f.hx; f.airY = f.hy;

function updAir(f, dt){
  const B = airBox();
  const ax = (calm ? 26 : 55) * S, ay = (calm ? 16 : 34) * S;
  const cx = clamp(f.x, B.l + ax, Math.max(B.l + ax, B.r - ax));
  const cy = clamp(f.y - f.lift, B.t + ay, Math.max(B.t + ay, B.b - ay));
  const tt = G.t - f.lt0;
  const ox = Math.sin(tt * f.w1 + f.p1) * ax, oy = Math.sin(tt * f.w2 + f.p2) * ay;
  const k = easeOut(span(tt, 0, 1.2));
  const e1 = Math.exp(-dt * 3), e2 = Math.exp(-dt * 0.5);
  f.pvx *= e1; f.pvy *= e1;
  f.pfx = (f.pfx + f.pvx * dt) * e2; f.pfy = (f.pfy + f.pvy * dt) * e2;
  f.airX = clamp(lerp(f.sx0, cx + ox, k) + f.pfx, B.l, B.r);
  f.airY = clamp(lerp(f.sy0, cy + oy, k) + f.pfy, B.t, B.b);
}
function startGust(){

  later(1.4, function(){ showHint('catch'); });
}
function updGust(dt){

  const gt = G.t - G.gust.t0, front = -60 * S + gt * (W + 120 * S) / 1.3;
  G.bend = (calm ? 0.06 : 0.22) * Math.sin(Math.PI * clamp(gt / 1.7, 0, 1));
  if (gt < 1.4){
    G.windAcc += dt * (calm ? 6 : 42);
    while (G.windAcc >= 1){
      G.windAcc -= 1;
      addP({ kind: 5, x: front - rnd(0, 140) * S, y: rnd(groundY - H * 0.25, H * 0.9), vx: 560 * S, vy: rnd(-18, 18) * S, g: 0, drag: 1, dur: rnd(0.35, 0.6), r: 1, col: '#ffffff', a: 0.9 });
    }

/* ---------- друзья луга ---------- */
function lookFriend(fr){ const d = clamp((fr.y - groundY) / Math.max(1, H - groundY), 0, 1); fr.s = S * (0.72 + 0.5 * d); }
function planFriends(){
  friends = [];
  for (let i = 0; i < FRIEND_KINDS.length; i++){
    let best = null, bs = -1;
    for (let k = 0; k < 40; k++){
      const x = rnd(safe.l + 34 * S, W - safe.r - 34 * S);
      const y = rnd(groundY + (H - groundY) * 0.22, H - safe.b - 46 * S);
      if (hyp(x - coc.x, y - coc.y) < 84 * S) continue;
      let bad = false;
      for (const p of stemPts) if (hyp(x - p.x, y - p.y) < 36 * S){ bad = true; break; }
      if (bad) continue;
      let m = 1e9;
      for (const q of friends) m = Math.min(m, hyp(q.x - x, q.y - y));
      for (const q of decos) m = Math.min(m, hyp(q.x - x, q.y - y) * 2.2);
      if (m > bs){ bs = m; best = { x: x, y: y }; }
    }
    if (!best) best = { x: rnd(W * 0.2, W * 0.8), y: groundY + (H - groundY) * 0.6 };
    const fr = { kind: FRIEND_KINDS[i], x: best.x, y: best.y, u: best.x / W, v: (best.y - groundY) / Math.max(1, H - groundY),
      awake: false, found: false, wt: 0, ph: rnd(0, TAU), s: 1, look: 0 };
    lookFriend(fr);
    friends.push(fr);
  }
  friends.sort(function(a, c){ return a.y - c.y; });
}
function wakeFriend(fr, byPlayer){
  if (fr.awake) return;
  fr.awake = true; fr.wt = 0; fr.found = byPlayer;
  if (byPlayer){ G.friendsFound++; G.idle = 0; Snd.friend(fr.kind); hearts(fr.x, fr.y - 26 * fr.s, calm ? 3 : 6); }
}
function updFriends(dt){
  for (const fr of friends){
    if (fr.awake && fr.wt < 1) fr.wt = Math.min(1, fr.wt + dt / (calm ? 0.5 : 0.7));
    if (fr.awake && b.vis){ const tg = clamp((b.x - fr.x) / (60 * S), -1, 1); fr.look += (tg - fr.look) * (1 - Math.exp(-dt * 6)); }
    if (!fr.awake && !calm && G.state === 'fly' && Math.random() < dt * 0.22)
      addP({ kind: 1, x: fr.x + rnd(-10, 10) * fr.s, y: fr.y - rnd(8, 22) * fr.s, vx: 0, vy: -6 * S, g: 0, drag: 1, dur: 0.9, r: rnd(2, 3) * S, col: '#fff6d8', a: 0.85 });
  }
}
function eyes(x1, x2, y, r, lk, open){

function drawFriend(fr, t){

function friendLadybug(fr, w, t, open){

function doSpin(){
  if (G.spin >= 0) return;

/* ================= логика ================= */
function moveB(dt, dvx, dvy, rate){
  const k = 1 - Math.exp(-dt * rate);
  b.vx += (dvx - b.vx) * k; b.vy += (dvy - b.vy) * k;
  b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.x < lim.l){ b.x = lim.l; if (b.vx < 0) b.vx = 0; }
  if (b.x > lim.r){ b.x = lim.r; if (b.vx > 0) b.vx = 0; }
  if (b.y < lim.t){ b.y = lim.t; if (b.vy < 0) b.vy = 0; }
  if (b.y > lim.b){ b.y = lim.b; if (b.vy > 0) b.vy = 0; }
  const sp = hyp(b.vx, b.vy), sr = clamp(sp / MAXV(), 0, 1);
  b.ph += dt * TAU * (calm ? 2.2 + 0.8 * sr : 3.1 + 2.8 * sr);
  const tt = clamp(b.vx / MAXV(), -1, 1) * (calm ? 0.25 : 0.42);
  b.tilt += (tt - b.tilt) * (1 - Math.exp(-dt * 7));
  return sp;
}
function steer(dt, tx, ty, vmul, gain, rate){
  const dx = tx - b.x, dy = ty - b.y, d = hyp(dx, dy);
  let dvx = 0, dvy = 0;
  if (d > 0.5){ const sp = Math.min(MAXV() * vmul, d * gain); dvx = dx / d * sp; dvy = dy / d * sp; }
  return moveB(dt, dvx, dvy, rate);
}
function restPoint(){
  const top = finalBottom + 54 * S, bot = againTop - 60 * S;
  let y = clamp(groundY - 4 * S, top, Math.max(top, bot));
  if (top > bot) y = (finalBottom + againTop) / 2;
  return { x: W / 2, y: clamp(y, lim.t, lim.b) };
}

function startBirth(){
  if (G.state !== 'title') return;
  G.state = 'birth'; G.stT = 0;
  elIntro.classList.add('gone');
  hideBtn(elOpen);
  later(0.45, function(){ Snd.open(); });
  later(1.4, function(){ Snd.wings(); });
}
function updBirth(dt){
  const tt = G.stT;
  G.cocOpen = 0.95 * easeOut(span(tt, 0.42, 0.8));
  G.cocRot = calm ? 0 : 0.13 * Math.sin(tt * TAU * 4.2) * (1 - span(tt, 0.05, 0.5)) * span(tt, 0, 0.06);
  G.spot = 0.16 * span(tt, 0, 0.35) * (1 - span(tt, 1.75, 2.4));
  if (tt >= 1.55){ b.amp = span(tt, 1.55, 1.95); b.ph += dt * TAU * (calm ? 2.2 : 3.4); }
  if (tt >= BIRTH_END) startFly();
}
function startFly(){
  const F = cocFrame();
  const P = birthPose(BIRTH_END, F);       // последняя поза анимации = первая поза под управлением
  G.state = 'fly'; G.stT = 0; G.idle = 0; G.cocRot = 0;
  b.x = P.x; b.y = P.y; b.vx = 0; b.vy = 0; b.tilt = P.tilt; b.sc = 1; b.open = 1; b.amp = 1; b.vis = true;
  planSeeds();
  elCounter.classList.add('show');
  later(0.25, function(){ const f = flowers[0]; if (f && f.st === 0){ f.st = 1; f.g = 0; } });
  later(0.85, function(){ showHint('touch'); });
}
function goalOf(f){
  if (f.st === 7) return { x: f.airX, y: f.airY, air: true };
  if (f.st === 2 || (f.st === 1 && f.g > 0.3)) return { x: f.x, y: f.y, air: false };
  return null;
}
function pickNear(x, y){
  let best = null, bp = null, bd = Math.max(64, 76 * S);
  for (const f of flowers){ const p = goalOf(f); if (!p) continue; const d = hyp(p.x - x, p.y - y); if (d < bd){ bd = d; best = f; bp = p; } }
  return best ? { f: best, p: bp } : null;
}
function aim(x, y){
  G.idle = 0;
  let h = pickNear(x, y);
  if (h){
    // касание рядом со спящим другом ведёт к другу, а не к соседней пыльце
    const dh = hyp(h.p.x - x, h.p.y - y);
    for (const fr of friends) if (!fr.awake && hyp(fr.x - x, fr.y - 14 * fr.s - y) < Math.min(dh, 44 * S)){ h = null; break; }
  }
  if (h) ptr.target = { x: h.p.x, y: h.p.y, track: h.p.air ? h.f : null };
  else ptr.target = { x: clamp(x, lim.l, lim.r), y: clamp(y, lim.t, lim.b), track: null };
}
function updFly(dt){
  G.idle += dt;
  if (ptr.target && ptr.target.track){
    const tf = ptr.target.track;
    if (tf.st === 7){ ptr.target.x = tf.airX; ptr.target.y = tf.airY; } else ptr.target.track = null;
  }
  let dvx = 0, dvy = 0;
  const kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if (kx || ky){
    ptr.target = null;
    const n = hyp(kx, ky);
    dvx = kx / n * KSPD(); dvy = ky / n * KSPD(); G.idle = 0;
  } else if (ptr.target){
    const dx = ptr.target.x - b.x, dy = ptr.target.y - b.y, d = hyp(dx, dy);
    if (d > 0.5){ const sp = MAXV() * Math.min(1, d / (120 * S)); dvx = dx / d * sp; dvy = dy / d * sp; }
  }
  const sp = moveB(dt, dvx, dvy, ptr.down ? 11 : 8);
  trail(dt, sp);
  const cr = Math.max(28, 30 * S), hr = Math.max(34, 40 * S), lr = Math.max(80, 96 * S);
  let near = null, nd = 1e9;
  for (const f of flowers){
    if (G.state !== 'fly') break;
    const p = goalOf(f);
    if (!p) continue;
    const d = hyp(b.x - p.x, b.y - p.y);
    if (f.mode === 0){
      if ((f.st === 2 || f.g > 0.45) && d < cr){ collect(f, p.x, p.y); continue; }
    } else if (f.mode === 1){
      if (f.st === 2){
        if (d < hr){
          f.wake = Math.min(1, f.wake + dt / 0.95); G.idle = 0;
          const tk = Math.floor(f.wake * 3);
          if (tk > f.tick && tk < 3){ f.tick = tk; Snd.tick(tk - 1); }
          if (f.wake >= 1){ collect(f, f.hx, f.hy - 6 * f.s); continue; }
        } else { f.wake = Math.max(0, f.wake - dt * 0.35); f.tick = Math.floor(f.wake * 3); }
      }
    } else {
      if (f.st === 2 && d < lr){ liftSeed(f); continue; }
      if (f.st === 7){
        if (d < cr + 4 * S){ collect(f, f.airX, f.airY); continue; }
        if (!f.puffed && !calm && d < 84 * S && G.t - f.lt0 > 1.3){
          f.puffed = true;
          const dd = Math.max(1, d);
          f.pvx = (f.airX - b.x) / dd * 170 * S; f.pvy = (f.airY - b.y) / dd * 110 * S;
          Snd.puff();
        }
      }
    }
    if (d < nd){ nd = d; near = f; }
  }
  G.nearest = near;
  if (G.state === 'fly'){
    // друг просыпается, только если бабочка задержалась рядом, а не пролетела мимо
    const slow = hyp(b.vx, b.vy) < 110 * S;
    for (const fr of friends){
      if (fr.awake) continue;
      if (slow && hyp(b.x - fr.x, b.y - (fr.y - 14 * fr.s)) < Math.max(40, 46 * S)) fr.acc = (fr.acc || 0) + dt;
      else fr.acc = Math.max(0, (fr.acc || 0) - dt * 2);
      if (fr.acc > 0.3) wakeFriend(fr, true);
    }
  }
  if (near && G.idle > 4.5 && G.state === 'fly'){
    G.guideAcc += dt * (calm ? 2 : 5);
    while (G.guideAcc >= 1){ G.guideAcc -= 1; guide(near); }
  } else G.guideAcc = 0;
  if (G.hint) placeHint();
}
function collect(f, px, py){
  f.st = 3; f.bt = 0; f.wake = 1;
  G.count++; G.idle = 0;
  const n = G.count;
  setCounter(n, true);
  G.sunT = n / 18 * 0.85;
  flying.push({ x0: px, y0: py, t: 0 });
  burst(px, py, calm ? 5 : 10, f.group === 0 ? PINKS : (f.group === 1 ? LILACS : GOLDS));
  if (f.mode === 2) burst(f.hx, f.hy, calm ? 2 : 5, GOLDS);
  Snd.collect(n - 1);
  doneHint(f.mode === 0 ? 'touch' : (f.mode === 1 ? 'sleep' : 'catch'));
  if (n === 1) later(0.45, function(){ spawnGroup(0); });
  if (n === 6 || n === 12){ const st = n / 6; later(0.35, function(){ stageUp(st); }); }
  if (n === 18) startFinale(f);
}
function stageUp(st){
  if (G.state !== 'fly') return;
  G.stage = st;
  if (st === 1){ G.lilacT = 1; G.beesT = 1; } else { G.goldT = 1; G.rainbowT = 1; }
  ring(st === 1 ? LILACS : GOLDS);
  Snd.stage(st);
  later(0.45, function(){ spawnGroup(st); });
  if (st === 1) later(1.9, function(){ showHint('sleep'); });
  else later(2.3, startGust);
}
function startFinale(f){
  G.state = 'finale'; G.stT = 0; G.originF = f; G.giltT = 1; G.th0 = null; G.melody = false;
  G.waveR = 0; G.waveT = 0; G.nearest = null;
  ptr.down = false; ptr.target = null; keys.l = keys.r = keys.u = keys.d = false;
  elCounter.classList.add('done');
  G.sunT = 1;
  clearHint();
}
function updFinale(dt){
  const ft = G.stT, o = G.originF;
  const dur = calm ? 1.8 : 2.0;
  const wt = span(ft, 0.15, 0.15 + dur);
  const wm = Math.max(hyp(o.x, o.y), hyp(W - o.x, o.y), hyp(o.x, H - o.y), hyp(W - o.x, H - o.y)) + 30;
  G.waveR = wm * (calm ? ease(wt) : 0.82 * easeOut(wt) + 0.18 * wt);
  G.waveT = wt;
  if (ft >= 0.15 && !G.melody){ G.melody = true; Snd.finale(); }
  for (const d of decos){
    if (d.st === 4 && hyp(d.x - o.x, d.y - o.y) <= G.waveR){
      d.st = 5; d.bt = 0;
      if (!calm && Math.random() < 0.5) burst(d.hx, d.hy, 3, GOLDS);
    } else if (d.st === 6 && !d.woke && hyp(d.x - o.x, d.y - o.y) <= G.waveR){ d.woke = true; d.bt = 0; }
  }
  for (const f of flowers) if (f.st === 3 && f.pulse < 0 && hyp(f.x - o.x, f.y - o.y) <= G.waveR) f.pulse = 0;
  for (const fr of friends) if (!fr.awake && hyp(fr.x - o.x, fr.y - o.y) <= G.waveR){ wakeFriend(fr, false); if (!calm) hearts(fr.x, fr.y - 22 * fr.s, 2); }
  if (wt > 0 && wt < 1){
    G.sparkAcc += dt * (calm ? 10 : 80);
    while (G.sparkAcc >= 1){
      G.sparkAcc -= 1;
      for (let k = 0; k < 5; k++){
        const a = rnd(0, TAU), x = o.x + Math.cos(a) * G.waveR, y = o.y + Math.sin(a) * G.waveR;
        if (x > 0 && x < W && y > groundY + 4 && y < H - 6){ riseSpark(x, y); break; }
      }
    }
  }
  ambient(dt, wt >= 1 ? 7 : 0);
  // бабочка делает мягкий круг над поляной
  const C = { x: W / 2, y: groundY + (H - groundY) * 0.3 };
  const rx = Math.min(W * 0.32, 180 * S), ry = Math.min(rx * 0.5, (H - groundY) * 0.26);
  const CIRC = 2.6;
  if (!calm && ft >= 0.3 && ft < 0.3 + CIRC){
    if (G.th0 === null) G.th0 = Math.atan2((b.y - C.y) / ry, (b.x - C.x) / rx);
    const th = G.th0 + TAU * easeInOut((ft - 0.3) / CIRC);
    steer(dt, C.x + Math.cos(th) * rx, C.y + Math.sin(th) * ry, 0.9, 5.5, 6);
  } else if (ft < 0.3){
    moveB(dt, 0, 0, 5);
  } else {
    const R = restPoint();
    steer(dt, R.x, R.y, 0.6, 3.2, 4);
  }
  if (ft >= 4.2) showEnd();
}
function ambient(dt, rate){
  if (rate <= 0) return;
  G.ambAcc += dt * rate * (calm ? 0.3 : 1);
  while (G.ambAcc >= 1){ G.ambAcc -= 1; riseSpark(rnd(0, W), rnd(groundY + 10, H - 10)); }
}
function showEnd(){
  G.state = 'end';
  const n = G.friendsFound;
  elFinalSub.textContent = n >= FRIEND_KINDS.length ? 'Ты нашла всех друзей луга!'
    : (n === 0 ? 'В траве прячутся друзья. Найдёшь их?' : 'Друзей луга найдено: ' + n + ' из ' + FRIEND_KINDS.length);
  elFinal.classList.add('show'); elFinal.removeAttribute('aria-hidden');
  showBtn(elAgain);
}
function updEnd(dt){
  const R = restPoint();
  const tx = R.x + (calm ? 0 : Math.sin(G.t * 0.8) * 12 * S), ty = R.y + (calm ? 0 : Math.sin(G.t * 1.6) * 6 * S);
  steer(dt, tx, ty, 0.5, 3.2, 3.5);
  ambient(dt, 6);
}
function again(){
  if (G.state !== 'end') return;
  G.state = 'reset';
  hideBtn(elAgain);
  elFinal.classList.remove('show'); elFinal.setAttribute('aria-hidden', 'true');
  G.fadeDir = 1;
}
function updFade(dt){
  if (G.fadeDir > 0){
    G.fade = Math.min(1, G.fade + dt / (calm ? 0.3 : 0.45));
    if (G.fade >= 1){ newGame(); G.fadeDir = -1; }
  } else {
    G.fade = Math.max(0, G.fade - dt / (calm ? 0.35 : 0.6));
    if (G.fade <= 0) G.fadeDir = 0;
  }
}
function updFlowers(dt){
  for (const f of flowers){
    if (f.st === 1){
      f.g += dt / (calm ? 0.45 : 0.7);
      if (f.g >= 1){ f.g = 1; f.st = 2; }
      f.open = 0.32;
    } else if (f.st === 2){
      f.open = 0.32 + (calm ? 0 : 0.03 * Math.sin(G.t * 2 + f.ph));
    } else if (f.st === 7){
      f.open = 0.32;
      updAir(f, dt);
    } else if (f.st === 3){
      f.bt += dt;
      f.open = calm ? lerp(0.32, 1, ease(f.bt / 0.5)) : 0.32 + 0.68 * backOut(Math.min(1, f.bt / 0.65));
      if (f.pulse >= 0) f.pulse += dt;
    }
  }
  for (const d of decos) if ((d.st === 5 || (d.st === 6 && d.woke)) && d.bt < 1) d.bt = Math.min(1, d.bt + dt / (calm ? 0.6 : 0.8));
}
function updFlying(dt){
  for (let i = flying.length - 1; i >= 0; i--){
    const s = flying[i];
    s.t += dt / 0.34;
    if (s.t >= 1){
      flying.splice(i, 1);
      b.glow = 1;
      burst(b.x, b.y, calm ? 2 : 4, GOLDS);
    }
  }
}

function update(dt){
  G.t += dt; G.stT += dt;
  runTimers();
  G.twitch = 0;
  if (G.state === 'title' && !calm){ const p = G.t % 3.6; if (p < 0.5) G.twitch = 0.06 * Math.sin(p * TAU * 4) * (1 - p / 0.5); }
  if (G.state === 'birth') updBirth(dt);
  else if (G.state === 'fly') updFly(dt);
  else if (G.state === 'finale') updFinale(dt);
  else if (G.state === 'end' || G.state === 'reset') updEnd(dt);
  if (G.state !== 'birth') G.spot = Math.max(0, G.spot - dt * 0.5);
  G.lilac = approach(G.lilac, G.lilacT, dt / 0.9);
  G.gold = approach(G.gold, G.goldT, dt / 0.9);
  G.gilt = approach(G.gilt, G.giltT, dt / 0.9);
  G.sun = approach(G.sun, G.sunT, dt * 0.15);
  G.rainbow = approach(G.rainbow, G.rainbowT, dt / 2.5);
  G.bees = approach(G.bees, G.beesT, dt / 2);
  if (G.spin >= 0){ G.spin += dt; if (G.spin > 0.75) G.spin = -1; }
  updGust(dt); updFriends(dt);
  const glowFloor = (G.state === 'finale' || G.state === 'end' || G.state === 'reset') ? 0.5 * G.gilt : 0;
  b.glow = Math.max(glowFloor, b.glow - dt * 1.5);
  updFlowers(dt); updParts(dt); updFlying(dt);
  if (G.fadeDir) updFade(dt);
}

function newGame(){
  timers.length = 0; parts.length = 0; flying.length = 0;
  G.state = 'title'; G.stT = 0; G.count = 0; G.stage = 0;
  G.lilac = G.lilacT = G.gold = G.goldT = G.gilt = G.giltT = 0;
  G.idle = 0; G.waveR = 0; G.waveT = 0; G.originF = null; G.cocOpen = 0; G.cocRot = 0;
  G.hint = null; G.hintF = null; G.hintDone = {}; G.nearest = null;
  G.sun = G.sunT = G.rainbow = G.rainbowT = G.bees = G.beesT = G.bend = 0; G.gust = null; G.spin = -1; G.friendsFound = 0; G.guideAcc = G.sparkAcc = G.ambAcc = G.trailAcc = 0; G.th0 = null; G.melody = false;
  b.x = coc.x; b.y = coc.y; b.vx = b.vy = 0; b.tilt = 0; b.ph = 0; b.amp = 0; b.open = 0.12; b.sc = 0.72; b.glow = 0; b.vis = false;
  ptr.down = false; ptr.target = null;
  flowers = []; seedOrder = [];
  planDecos();
  planFriends();
  elFinalSub.textContent = 'Друзей луга найдено: 0 из 4';
  setCounter(0, false);
  elCounter.classList.remove('show', 'done');
  elIntro.classList.remove('gone');
  elFinal.classList.remove('show'); elFinal.setAttribute('aria-hidden', 'true');
  clearHint();
  showBtn(elOpen); hideBtn(elAgain);
}

/* ================= интерфейс ================= */
function setCounter(n, pop){
  elCnt.textContent = String(n);
  elCounter.setAttribute('aria-label', 'Пыльца: ' + n + ' из 18');
  if (pop && !calm){ elCnt.classList.remove('pop'); void elCnt.offsetWidth; elCnt.classList.add('pop'); }
}
function showBtn(el){ el.classList.remove('hide'); el.disabled = false; el.removeAttribute('aria-hidden'); el.tabIndex = 0; }
function hideBtn(el){ el.classList.add('hide'); el.disabled = true; el.setAttribute('aria-hidden', 'true'); el.tabIndex = -1; if (document.activeElement === el) el.blur(); }
function showHint(kind){
  if (G.state !== 'fly' || G.hintDone[kind]) return;
  G.hint = kind; G.hintF = null; elHint.textContent = HINTS[kind];
  placeHint();
}
function doneHint(kind){ G.hintDone[kind] = true; if (G.hint === kind) clearHint(); }
function clearHint(){ G.hint = null; G.hintF = null; elHint.classList.remove('show'); }
function hintValid(f){
  if (!f) return false;
  if (G.hint === 'sleep') return f.mode === 1 && f.st === 2;
  if (G.hint === 'catch') return f.st === 7;
  return false;
}
function hintAnchor(){
  if (G.hint === 'touch'){ const f = flowers[0]; return f && f.st !== 3 ? { x: f.x, y: f.y, s: f.s } : null; }
  if (!hintValid(G.hintF)){
    G.hintF = null; let bd = 1e9;
    for (const f of flowers){
      if (!hintValid(f)) continue;
      const p = goalOf(f); const d = hyp(p.x - b.x, p.y - b.y);
      if (d < bd){ bd = d; G.hintF = f; }
    }
  }
  const f = G.hintF; if (!f) return null;
  return f.st === 7 ? { x: f.airX, y: f.airY, s: Math.max(f.s, 0.95 * S) } : { x: f.x, y: f.y, s: f.s };
}
function placeHint(){
  const a = hintAnchor();
  if (!a){ elHint.classList.remove('show'); return; }
  elHint.classList.add('show');
  const x = clamp(a.x, safe.l + 92, W - safe.r - 92);
  let y = a.y + 40 * a.s + 18, below = true;
  if (y + 46 > H - safe.b - 8){ y = a.y - 38 * a.s - 18; below = false; }
  elHint.classList.toggle('below', below);
  elHint.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,' + (below ? '0' : '-100%') + ')';
}

/* ================= звук ================= */
const Snd = {
  ac: null, bus: null, on: false,
  build: function(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ac = new AC(); } catch (e){ this.ac = null; return false; }
    const ac = this.ac;
    const out = ac.createGain(); out.gain.value = 0.85; out.connect(ac.destination);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4600; lp.connect(out);
    this.bus = ac.createGain(); this.bus.gain.value = 0.6; this.bus.connect(lp);
    const dl = ac.createDelay(1); dl.delayTime.value = 0.23;
    const fb = ac.createGain(); fb.gain.value = 0.32;
    const damp = ac.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 2200;
    const wet = ac.createGain(); wet.gain.value = 0.3;
    this.bus.connect(dl); dl.connect(damp); damp.connect(fb); fb.connect(dl); damp.connect(wet); wet.connect(lp);
    return true;
  },
  enable: function(){
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e){}
    if (!this.ac && !this.build()) return false;
    const ac = this.ac;
    try { const bf = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource(); src.buffer = bf; src.connect(ac.destination); src.start(0); } catch (e){}
    if (ac.state !== 'running' && ac.resume) ac.resume();
    this.on = true;
    return true;
  },
  disable: function(){
    this.on = false;
    try { if (navigator.audioSession) navigator.audioSession.type = 'auto'; } catch (e){}
    if (this.ac && this.ac.state === 'running' && this.ac.suspend) this.ac.suspend();
  },
  tone: function(m, at, dur, vol, slide){
    if (!this.on || !this.ac) return;
    const ac = this.ac, t0 = ac.currentTime + 0.02 + (at || 0), f = 440 * Math.pow(2, (m - 69) / 12);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(440 * Math.pow(2, (slide - 69) / 12), t0 + Math.min(0.25, dur * 0.5));
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.018); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.bus); o.start(t0); o.stop(t0 + dur + 0.05);
    const o2 = ac.createOscillator(), g2 = ac.createGain();
    o2.type = 'triangle'; o2.frequency.value = f * 2;
    g2.gain.setValueAtTime(0.0001, t0); g2.gain.linearRampToValueAtTime(vol * 0.16, t0 + 0.012); g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.45);
    if (slide) return;
    o2.connect(g2); g2.connect(this.bus); o2.start(t0); o2.stop(t0 + dur);
  },
  collect: function(i){
    const N = [72, 74, 76, 79, 81, 84, 74, 76, 79, 81, 84, 86, 76, 79, 81, 84, 86, 88];
    const m = N[clamp(i, 0, 17)];
    this.tone(m, 0, 1.2, 0.2);
    if (i >= 6) this.tone(m - 12, 0, 0.9, 0.05);
    if (i >= 12) this.tone(m + 7, 0.06, 0.8, 0.035);
  },
  stage: function(st){
    if (st === 1){ this.tone(79, 0, 0.9, 0.12); this.tone(84, 0.13, 1.1, 0.12); }
    else { this.tone(81, 0, 0.9, 0.12); this.tone(88, 0.13, 1.2, 0.11); }
  },
  open: function(){ this.tone(76, 0, 0.5, 0.1); this.tone(83, 0.09, 0.7, 0.08); },
  wings: function(){ this.tone(88, 0, 0.8, 0.06); this.tone(91, 0.07, 0.9, 0.05); },
  finale: function(){
    const seq = [[72, 0], [76, 0.17], [79, 0.34], [84, 0.51], [86, 0.74], [88, 0.98]];
    const self = this;
    seq.forEach(function(p, i){ self.tone(p[0], p[1], i === 5 ? 2.2 : 1.1, i === 5 ? 0.2 : 0.17); });
    [60, 67, 76].forEach(function(m){ self.tone(m, 0, 2.6, 0.045); });
  },
  ping: function(){ this.tone(79, 0, 0.7, 0.12); },
  tick: function(k){ this.tone([76, 79, 83][clamp(k, 0, 2)], 0, 0.5, 0.08); },
  spin: function(){ this.tone(84, 0, 0.3, 0.08); this.tone(88, 0.07, 0.3, 0.08); this.tone(91, 0.14, 0.5, 0.08); },
  puff: function(){ this.tone(86, 0, 0.3, 0.05, 93); },
  friend: function(kind){
    if (kind === 'ladybug'){ this.tone(91, 0, 0.35, 0.08); this.tone(95, 0.09, 0.45, 0.07); }
    else if (kind === 'snail'){ this.tone(67, 0, 0.9, 0.1, 72); }
    else if (kind === 'hedgehog'){ this.tone(74, 0, 0.22, 0.1); this.tone(71, 0.12, 0.3, 0.09); this.tone(76, 0.26, 0.4, 0.08); }
    else { this.tone(72, 0, 0.45, 0.1, 84); this.tone(88, 0.22, 0.5, 0.07); }
  },
  gust: function(){
    if (!this.on || !this.ac) return;
    const ac = this.ac, t0 = ac.currentTime + 0.02, len = Math.floor(ac.sampleRate * 1.25);
    const buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(500, t0); bp.frequency.linearRampToValueAtTime(1400, t0 + 0.6); bp.frequency.linearRampToValueAtTime(700, t0 + 1.2);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.16, t0 + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
    src.connect(bp); bp.connect(g); g.connect(this.bus); src.start(t0); src.stop(t0 + 1.25);
  }
};

/* ================= ввод ================= */
cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  if (G.state === 'title'){
    if (hyp(x - coc.x, y - coc.y) < Math.max(70, 64 * S)) startBirth();
    return;
  }
  if (G.state !== 'fly') return;
  if (ptr.down && e.pointerId !== ptr.id) return;
  ptr.down = true; ptr.id = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err){}
  if (!pickNear(x, y) && hyp(x - b.x, y - b.y) < Math.max(32, 38 * S)){ doSpin(); G.idle = 0; return; }
  aim(x, y);
}, { passive: false });
cv.addEventListener('pointermove', function(e){
  if (!ptr.down || e.pointerId !== ptr.id || G.state !== 'fly') return;
  e.preventDefault();
  aim(e.clientX, e.clientY);
}, { passive: false });
function onUp(e){ if (e.pointerId === ptr.id) ptr.down = false; }
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('lostpointercapture', onUp);
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });
window.addEventListener('orientationchange', function(){ lastW = -1; setTimeout(function(){ lastW = -1; }, 350); });

const KEYC = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
const KEYK = { 'a': 'l', 'd': 'r', 'w': 'u', 's': 'd', 'ф': 'l', 'в': 'r', 'ц': 'u', 'ы': 'd' };
window.addEventListener('keydown', function(e){
  const k = KEYC[e.code] || KEYK[(e.key || '').toLowerCase()];
  if (k){
    e.preventDefault();
    if (G.state === 'fly'){ keys[k] = true; G.idle = 0; }
    return;
  }
  const act = e.key === 'Enter' || e.key === ' ' || e.code === 'Space';
  if (!act) return;
  const ae = document.activeElement;
  if (ae && ae.tagName === 'BUTTON' && !ae.disabled) return;
  if (G.state === 'title'){ e.preventDefault(); startBirth(); }
  else if (G.state === 'end'){ e.preventDefault(); again(); }
});
window.addEventListener('keyup', function(e){
  const k = KEYC[e.code] || KEYK[(e.key || '').toLowerCase()];
  if (k) keys[k] = false;
});
window.addEventListener('blur', function(){ keys.l = keys.r = keys.u = keys.d = false; ptr.down = false; });

elOpen.addEventListener('click', function(){ startBirth(); });
elAgain.addEventListener('click', function(){ again(); });
elSound.addEventListener('click', function(){
  if (Snd.on) Snd.disable();
  else if (Snd.enable()) Snd.ping();
  elSound.setAttribute('aria-pressed', Snd.on ? 'true' : 'false');
  elSound.setAttribute('aria-label', Snd.on ? 'Выключить звук' : 'Включить звук');
});
document.addEventListener('visibilitychange', function(){
  if (!Snd.ac) return;
  if (document.hidden){ if (Snd.ac.state === 'running') Snd.ac.suspend(); }
  else if (Snd.on && Snd.ac.resume) Snd.ac.resume();
});

/*@hook*/

/* ================= цикл ================= */
let last = performance.now(), frameN = 0;
function loop(now){
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now; frameN++;
  checkDims();
  if (frameN % 30 === 0 && readSafe()) relayout(W, H, DPR);
  update(dt);
  render();
  requestAnimationFrame(loop);
}
checkDims();
newGame();
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
